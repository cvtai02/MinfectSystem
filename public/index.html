<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minfect System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <svg class="topbar-logo" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.18 7 12 9.82 4.82 7 12 4.18zM4 8.64l7 3.5V19.5l-7-3.5V8.64zm9 10.86v-7.36l7-3.5v7.36l-7 3.5z"/>
      </svg>
      <span class="topbar-title">Minfect System</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-icon-btn" id="theme-toggle" title="Settings">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
          <path d="M10 3.5a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 3.5zm4.95 1.55a.75.75 0 010 1.06l-1.06 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.9 0a.75.75 0 011.06 0l1.06 1.06a.75.75 0 01-1.06 1.06L5.05 6.11a.75.75 0 010-1.06zM10 8a2 2 0 100 4 2 2 0 000-4zm-6.5 2a.75.75 0 01.75-.75h1.5a.75.75 0 010 1.5h-1.5A.75.75 0 013.5 10zm10.5-.75a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H14zm-2.83 3.58a.75.75 0 011.06 0l1.06 1.06a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm-4.28 1.06a.75.75 0 111.06-1.06l1.06 1.06a.75.75 0 01-1.06 1.06l-1.06-1.06zM10 14.5a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Left sidebar -->
    <nav class="sidebar">
      <a href="#" class="sidebar-item active" data-page="resources" title="Resources">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor">
          <path d="M2 4.5A2.5 2.5 0 014.5 2h11A2.5 2.5 0 0118 4.5v11a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 012 15.5v-11zM4.5 3.5a1 1 0 00-1 1v11a1 1 0 001 1h11a1 1 0 001-1v-11a1 1 0 00-1-1h-11zM5 6h10v1.5H5V6zm0 3h10v1.5H5V9zm0 3h7v1.5H5V12z"/>
        </svg>
        <span class="sidebar-label">Resources</span>
      </a>
      <a href="#" class="sidebar-item" data-page="console" title="Console Logs">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor">
          <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 1v10h10V5H5zm1.5 2l2.5 2-2.5 2-.7-.7L7.6 9 5.8 7.7l.7-.7zM9.5 11H13v1H9.5v-1z"/>
        </svg>
        <span class="sidebar-label">Console</span>
      </a>
      <a href="#" class="sidebar-item" data-page="env" title="Environment">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor">
          <path d="M10 2a8 8 0 100 16 8 8 0 000-16zM3.5 10a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM10 6a.75.75 0 01.75.75v2.5h2.5a.75.75 0 010 1.5h-2.5v2.5a.75.75 0 01-1.5 0v-2.5h-2.5a.75.75 0 010-1.5h2.5v-2.5A.75.75 0 0110 6z"/>
        </svg>
        <span class="sidebar-label">Environment</span>
      </a>
    </nav>

    <!-- Main content -->
    <main class="content">
      <!-- Resources page -->
      <div id="page-resources" class="page active">
        <div class="page-header">
          <h1 class="page-title">Resources</h1>
          <div class="page-actions">
            <div class="filter-box">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" class="filter-icon">
                <path d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
              </svg>
              <input type="text" id="filter-input" placeholder="Filter..." class="filter-input">
            </div>
          </div>
        </div>
        <div class="table-container">
          <table class="resource-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>State</th>
                <th>Port</th>
                <th>PID</th>
                <th>Group</th>
                <th>URLs</th>
                <th class="th-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="resource-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Console logs page -->
      <div id="page-console" class="page">
        <div class="page-header">
          <h1 class="page-title">Console Logs</h1>
          <div class="page-actions">
            <select id="console-app-select" class="aspire-select">
              <option value="">Select a resource...</option>
            </select>
            <select id="console-source" class="aspire-select">
              <option value="live">Live output</option>
              <option value="file-out">File: stdout</option>
              <option value="file-err">File: stderr</option>
            </select>
            <button class="aspire-btn" id="console-reload">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg>
              Clear
            </button>
          </div>
        </div>
        <div class="console-output-wrapper">
          <pre id="console-output" class="console-output"></pre>
        </div>
      </div>

      <!-- Environment page -->
      <div id="page-env" class="page">
        <div class="page-header">
          <h1 class="page-title">Environment</h1>
          <div class="page-actions">
            <select id="env-app-select" class="aspire-select">
              <option value="">Select a resource...</option>
            </select>
            <button class="aspire-btn aspire-btn-primary" id="env-save-btn">Save</button>
          </div>
        </div>
        <div class="env-info">
          <span id="env-filepath" class="env-filepath"></span>
        </div>
        <div class="env-editor-wrapper">
          <textarea id="env-editor" class="env-editor" spellcheck="false" placeholder="Select a resource to view its environment configuration..."></textarea>
        </div>
      </div>
    </main>
  </div>

  <!-- Context menu -->
  <div id="context-menu" class="context-menu hidden">
    <button class="context-item" data-action="view-logs">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 1v10h10V5H5zm1.5 2l2.5 2-2.5 2-.7-.7L7.6 9 5.8 7.7l.7-.7zM9.5 11H13v1H9.5v-1z"/></svg>
      Console logs
    </button>
    <button class="context-item" data-action="view-env">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM3.5 10a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM10 6a.75.75 0 01.75.75v2.5h2.5a.75.75 0 010 1.5h-2.5v2.5a.75.75 0 01-1.5 0v-2.5h-2.5a.75.75 0 010-1.5h2.5v-2.5A.75.75 0 0110 6z"/></svg>
      Environment
    </button>
    <div class="context-divider"></div>
    <button class="context-item" data-action="start">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M6.5 4.5v11l9-5.5-9-5.5z"/></svg>
      Start
    </button>
    <button class="context-item" data-action="stop">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><rect x="5" y="5" width="10" height="10" rx="1"/></svg>
      Stop
    </button>
    <button class="context-item" data-action="restart">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M10 3a7 7 0 00-7 7h2a5 5 0 019.54-2H12v2h5V5h-2v2.05A7 7 0 0010 3zm7 7a5 5 0 01-9.54 2H10v-2H5v5h2v-2.05A7 7 0 0017 10h-2z"/></svg>
      Restart
    </button>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
